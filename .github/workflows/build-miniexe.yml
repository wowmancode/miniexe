name: Build MiniEXE APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Winlator fork
        uses: actions/checkout@v4

      - name: Check out pinned Android app source
        run: git submodule update --init --depth 1 app

      - name: Apply MiniEXE app changes
        run: |
          git -C app apply --check ../patches/miniexe-app.patch
          git -C app apply ../patches/miniexe-app.patch

      - name: Relocate bundled runtime paths
        run: |
          python3 -m venv "$RUNNER_TEMP/miniexe-tools"
          "$RUNNER_TEMP/miniexe-tools/bin/pip" install zstandard==0.25.0
          "$RUNNER_TEMP/miniexe-tools/bin/python" scripts/relocate-assets.py app/app/src/main/assets

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build dependencies
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses < <(yes) > /dev/null
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;24.0.8215888' 'cmake;3.22.1'

      - name: Build ARM64 debug APK
        working-directory: app
        run: |
          chmod +x ./gradlew
          printf '\norg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m\n' >> gradle.properties
          set -o pipefail
          if ! ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Surface compile and resource errors as annotations (readable through the API).
            grep -E "error:|ERROR:|What went wrong|Duplicate resources|e: " -A2 "$RUNNER_TEMP/gradle.log" | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Verify APK contents
        run: |
          set -euo pipefail
          apk=app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.miniexes'"
          unzip -Z1 "$apk" | grep -F 'lib/arm64-v8a/libwinlator.so'
          sha256sum "$apk"
          du -h "$apk"

      - name: Publish APK as the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/MiniEXE-arm64-debug.apk"
          cp app/app/build/outputs/apk/debug/app-debug.apk "$apk"
          short=$(git rev-parse --short HEAD)
          subject=$(git log -1 --pretty=%s)
          notes="Debug build of ${GITHUB_SHA} (${subject}). Unsigned ARM64 debug APK; replaced on every push to main."
          # Exactly one release: remove the previous one and its tag, then publish this build.
          gh release delete latest --yes --cleanup-tag || true
          git push --delete origin latest 2>/dev/null || true
          gh release create latest "$apk" --target "$GITHUB_SHA" --title "MiniEXE latest ($short)" --notes "$notes" --latest
          # Remove any other releases (and their tags) so only "latest" remains.
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ "$tag" != "latest" ]; then gh release delete "$tag" --yes --cleanup-tag || true; fi
          done
